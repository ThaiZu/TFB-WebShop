<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title data-i18n="activation.title"></title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<!--
  « Nouveau mot de passe » — la page d'arrivée du lien envoyé par l'ERP après
  « Mot de passe oublié » (CLIENT_PASSWORD_RESET_URL = …/webshop/reset-password).
  Le jeton vient de l'URL (?token=…), n'est jamais journalisé ni stocké : il
  part une seule fois à POST /clients/auth/password/reset/confirm.
  l'ERP. Il vaut une heure, un seul usage. Aucun mot de passe local : c'est
  l'ERP qui l'enregistre. Page AUTONOME, comme « Créer mon compte ».
-->
<style>
  @font-face { font-family:'Gotham'; src:url('fonts/Gotham_Book.otf') format('opentype');    font-weight:400; font-display:swap }
  @font-face { font-family:'Gotham'; src:url('fonts/Gotham_Regular.otf') format('opentype'); font-weight:500; font-display:swap }
  @font-face { font-family:'Gotham'; src:url('fonts/Gotham_Medium.otf') format('opentype');  font-weight:600; font-display:swap }

  :root{
    --primary:#8D1D2C;        /* Ruby — actions, bandeau, erreurs */
    --secondary:#F2C9A0;      /* Abricot — état lié */
    --on-abricot:#6b4420;
    --bg:#EAE4DC; --surface:#fff; --bg2:#F4EFE8;
    --txt:#222; --mut:#666;
    --bd2:rgba(34,34,34,.18); --bd3:rgba(34,34,34,.10);
    --vert:#2d7a3e;
    --r-md:8px; --r-lg:12px; --r-pill:999px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:400 15px/1.5 Gotham,Helvetica,Arial,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 56px}
  .card{width:100%;max-width:560px;background:var(--surface);border:0.5px solid var(--bd3);
        border-radius:var(--r-lg);overflow:hidden;box-shadow:0 14px 44px rgba(34,34,34,.09)}
  .top{background:var(--primary);color:#fff;padding:24px 26px 22px;display:flex;flex-direction:column;gap:12px}
  .top img{height:34px;width:auto;align-self:flex-start;object-fit:contain}
  .top h1{margin:0 0 6px;font-size:26px;font-weight:500;line-height:1.25;letter-spacing:-.01em}
  .top p{margin:0;font-size:13.5px;line-height:1.5;opacity:.88}

  /* Bandeau « pré-lié » — ce que l'employé n'a PAS à saisir, donc pas à vérifier. */
  .prelie{display:flex;align-items:center;gap:14px;padding:16px 26px;background:var(--bg2);
          border-bottom:0.5px solid var(--bd3)}
  .logo{width:52px;height:52px;flex:none;border-radius:11px;background:var(--surface);
        border:0.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;
        font-size:15px;font-weight:500;color:var(--primary);overflow:hidden}
  .qui{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .qui .b{font-size:15px;font-weight:500;line-height:1.3}
  .qui .d{font-size:12.5px;line-height:1.45;color:var(--mut)}
  .verrou{flex:none;white-space:nowrap;font-size:10.5px;font-weight:500;letter-spacing:.06em;
          text-transform:uppercase;color:var(--on-abricot);background:var(--secondary);
          border-radius:var(--r-pill);padding:6px 11px;line-height:1}

  form{padding:22px 26px 26px;display:grid;gap:18px}
  .duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
  label{display:block;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
        color:var(--mut);margin:0 0 6px}
  input,select{width:100%;padding:12px 13px;border:0.5px solid var(--bd2);border-radius:var(--r-md);
        font:400 15px Gotham,Helvetica,Arial,sans-serif;background:var(--surface);color:var(--txt)}
  input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(141,29,44,.14)}
  input[aria-invalid="true"]{border-color:var(--primary)}
  .aide{margin-top:6px;font-size:11.5px;line-height:1.45;color:var(--mut)}
  .aide b{color:var(--txt);font-weight:500}
  .err{margin-top:6px;font-size:11.5px;line-height:1.45;color:var(--primary)}
  .err a{color:var(--primary);font-weight:500}
  .cgv{display:flex;gap:11px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--mut)}
  .cgv input{width:auto;flex:none;margin:3px 0 0;accent-color:var(--primary)}
  button{width:100%;padding:15px;border:none;border-radius:var(--r-md);background:var(--primary);
         color:#fff;font:500 15px/1.2 Gotham,Helvetica,Arial,sans-serif;cursor:pointer}
  button[disabled]{opacity:.45;cursor:not-allowed}
  .apres{margin:0;text-align:center;font-size:12px;line-height:1.5;color:var(--mut)}
  .apres b{color:var(--txt);font-weight:500}

  .fin{padding:26px 26px 28px;display:grid;gap:14px;justify-items:center;text-align:center}
  .rond{width:46px;height:46px;border-radius:50%;background:var(--secondary);color:var(--on-abricot);
        display:flex;align-items:center;justify-content:center;font-size:20px}
  .fin .t{font-size:19px;font-weight:500;line-height:1.3}
  .fin p{margin:0;max-width:420px;font-size:13.5px;line-height:1.6;color:var(--mut)}
  .fin .sep{width:100%;max-width:420px;border-top:0.5px solid var(--bd3);padding-top:14px;
            font-size:12.5px;line-height:1.6;color:var(--mut)}
  .fin b{color:var(--txt);font-weight:500}
  .pied{width:100%;max-width:560px;margin-top:20px;text-align:center;font-size:11.5px;line-height:1.6;color:var(--mut)}
  .pied b{color:var(--txt);font-weight:500}
  a{color:var(--primary)}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="card">
  <div class="top"><h1 data-i18n="activation.title"></h1></div>
  <div class="fin">
    <p data-i18n="activation.intro"></p>
    <p id="activationMessage" role="status"></p>
    <button id="confirmActivation" data-i18n="activation.confirm" disabled></button>
    <form id="resendActivation" novalidate>
      <label for="activationEmail" data-i18n="form.email"></label>
      <input id="activationEmail" type="email" autocomplete="email">
      <button id="resendButton" data-i18n="activation.resend"></button>
    </form>
    <a href="./" data-i18n="ui.login"></a>
  </div>
</div>
<script src="./api-runtime-config.js"></script>
<script src="./i18n-runtime.js"></script>
<script src="./i18n-page.js"></script>
<script src="./activate-account.js"></script>
</body></html>
